services:
  app:
    image: ghcr.io/koreader/kosync:sha-46ef6b8
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${VIRTUAL_HOST}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - data:/app/data
    networks:
      - proxy_frontend

volumes:
  data:

networks:
  proxy_frontend:
    external: true
